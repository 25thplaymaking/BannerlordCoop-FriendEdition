name: Launcher App Release

# Builds the Calradia Co-op launcher itself (the WPF app, tools/CoopLauncher) as a self-contained
# single-file Windows .exe and publishes it with a SHA-256 manifest. Development pushes refresh the
# opt-in `launcher-nightly` feed; stable `launcher-app` publication remains an explicit manual choice.

on:
  push:
    branches: [development]
    paths:
      - 'tools/CoopLauncher/**'
      - 'tools/CoopLauncher.Tests/**'
      - '.github/workflows/launcher-app-release.yml'
      - '.github/scripts/verify-release-safety.py'
  workflow_dispatch:
    inputs:
      channel:
        description: Launcher release channel
        required: true
        type: choice
        options: [nightly, stable]
        default: nightly

permissions:
  contents: write

concurrency:
  group: launcher-app-release
  cancel-in-progress: true

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Verify release safety policy
        run: |
          python -m pip install PyYAML==6.0.3
          python .github/scripts/verify-release-safety.py

  build:
    needs: safety
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run launcher safety tests
        run: dotnet test tools/CoopLauncher.Tests/CoopLauncher.Tests.csproj -c Release -p:NuGetAudit=false --consoleLoggerParameters:ErrorsOnly

      - name: Check XAML resources
        run: python tools/CoopLauncher/check-xaml-resources.py

      - name: Select channel and version
        id: release
        shell: bash
        env:
          REQUESTED_CHANNEL: ${{ github.event_name == 'push' && 'nightly' || inputs.channel }}
        run: |
          set -eu
          channel="${REQUESTED_CHANNEL:-nightly}"
          case "$channel" in
            nightly) tag="launcher-nightly" ;;
            stable)  tag="launcher-app" ;;
            *) echo "unsupported channel: $channel" >&2; exit 1 ;;
          esac
          version="$(date -u +'%Y.%-m.%-d').${GITHUB_RUN_NUMBER}"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish single-file launcher
        shell: bash
        run: |
          set -eu
          dotnet publish tools/CoopLauncher/CoopLauncher.csproj -c Release -p:NuGetAudit=false \
            -p:Version="${{ steps.release.outputs.version }}"
          out="tools/CoopLauncher/bin/Release/net8.0-windows/win-x64/publish"
          test -s "$out/CalradiaCoop.exe"
          test -s "$out/launcher-config.json"
          mkdir -p dist
          cp "$out/CalradiaCoop.exe" dist/
          cp "$out/launcher-config.json" dist/
          # Distribution bundle: the .exe reads launcher-config.json from beside it.
          powershell -Command "Compress-Archive -Path dist/CalradiaCoop.exe,dist/launcher-config.json -DestinationPath dist/CalradiaCoop-Launcher.zip -Force"

      - name: Generate self-update manifest
        shell: bash
        run: |
          set -eu
          sha="$(sha256sum dist/CalradiaCoop.exe | awk '{print $1}')"
          tag="${{ steps.release.outputs.tag }}"
          version="${{ steps.release.outputs.version }}"
          url="https://github.com/25thplaymaking/BannerlordCoop-FriendEdition/releases/download/$tag/CalradiaCoop.exe"
          printf '{"version":"%s","launcherUrl":"%s","sha256":"%s","notes":"Launcher source %s"}\n' \
            "$version" "$url" "$sha" "$GITHUB_SHA" > dist/launcher.json
          test "$(wc -c < dist/launcher.json)" -gt 100

      - name: Publish rolling launcher release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ steps.release.outputs.tag }}"
          channel="${{ steps.release.outputs.channel }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Calradia Co-op — $channel launcher" \
              --notes "Portable launcher feed. Stable is manual; nightly follows verified development builds."
          fi
          gh release upload "$tag" \
            dist/CalradiaCoop.exe dist/launcher-config.json \
            dist/CalradiaCoop-Launcher.zip dist/launcher.json --clobber
