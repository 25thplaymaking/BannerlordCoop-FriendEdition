name: Campaign Portal Deploy

on:
  push:
    branches: [development]
    paths:
      - 'services/coop-portal/**'
      - '.github/workflows/portal-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: campaign-portal-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/coop-portal
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/coop-portal/package-lock.json

      - run: npm ci
      - run: npm run types -- --check
      - run: npm run check
      - run: npm test

      - name: Verify deployment credentials
        shell: bash
        env:
          PORTAL_SERVER_HOST: ${{ secrets.PORTAL_SERVER_HOST }}
          PORTAL_SERVER_USER: ${{ secrets.PORTAL_SERVER_USER }}
          PORTAL_SERVER_SSH_KEY: ${{ secrets.PORTAL_SERVER_SSH_KEY }}
          PORTAL_SERVER_HOST_KEY: ${{ secrets.PORTAL_SERVER_HOST_KEY }}
        run: |
          set -eu
          test -n "$PORTAL_SERVER_HOST"
          test -n "$PORTAL_SERVER_USER"
          test -n "$PORTAL_SERVER_SSH_KEY"
          test -n "$PORTAL_SERVER_HOST_KEY"

      - name: Deploy portal service
        shell: bash
        env:
          PORTAL_SERVER_HOST: ${{ secrets.PORTAL_SERVER_HOST }}
          PORTAL_SERVER_USER: ${{ secrets.PORTAL_SERVER_USER }}
          PORTAL_SERVER_SSH_KEY: ${{ secrets.PORTAL_SERVER_SSH_KEY }}
          PORTAL_SERVER_HOST_KEY: ${{ secrets.PORTAL_SERVER_HOST_KEY }}
        run: |
          set -eu
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PORTAL_SERVER_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PORTAL_SERVER_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          tar --exclude=node_modules --exclude=.wrangler -czf "$RUNNER_TEMP/portal.tgz" .
          scp "$RUNNER_TEMP/portal.tgz" "$PORTAL_SERVER_USER@$PORTAL_SERVER_HOST:bannerlord-coop/portal/releases/$GITHUB_SHA.tgz"
          ssh "$PORTAL_SERVER_USER@$PORTAL_SERVER_HOST" \
            "set -eu; release=\$HOME/bannerlord-coop/portal/releases/$GITHUB_SHA; mkdir -p \"\$release\"; tar -xzf \$HOME/bannerlord-coop/portal/releases/$GITHUB_SHA.tgz -C \"\$release\"; ln -sfn \"\$release\" \$HOME/bannerlord-coop/portal/current; systemctl --user restart calradia-coop-portal.service; curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4211/health"

      - name: Publish portal discovery document
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PORTAL_URL: https://calradia-coop.frontir.solutions
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/portal-release"
          printf '{"portalUrl":"%s","source":"%s"}\n' "$PORTAL_URL" "$GITHUB_SHA" \
            > "$RUNNER_TEMP/portal-release/portal.json"
          if ! gh release view portal-config >/dev/null 2>&1; then
            gh release create portal-config --title 'Calradia Co-op portal discovery' \
              --notes 'Rolling launcher discovery document for the campaign portal.'
          fi
          gh release upload portal-config "$RUNNER_TEMP/portal-release/portal.json" --clobber
          printf 'Portal: %s\n' "$PORTAL_URL" >> "$GITHUB_STEP_SUMMARY"
