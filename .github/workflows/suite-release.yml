name: Launcher Suite Release

# Licensed Workshop bytes are uploaded by an authorized maintainer to the immutable suite-payloads
# release. CI downloads only a small descriptor, verifies every declared part against GitHub's
# recorded release-asset size and SHA-256, then publishes only suite.json to the rolling feed.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Suite release channel
        type: choice
        default: nightly
        options: [nightly, stable]
      descriptor:
        description: Immutable suite-<sha256>-v<version>.json asset on suite-payloads
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: launcher-suite-release-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Verify release safety policy
        run: |
          python -m pip install PyYAML==6.0.3
          python .github/scripts/verify-release-safety.py

      - name: Test suite feed builders
        run: python -m unittest discover -s .github/scripts -p 'test_*suite*.py'

      - name: Download descriptor and GitHub asset metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DESCRIPTOR: ${{ inputs.descriptor }}
        run: |
          set -eu
          if ! printf '%s\n' "$DESCRIPTOR" | grep -Eq '^suite-[0-9a-f]{64}-v[0-9]+(\.[0-9]+)*\.json$'; then
            echo 'descriptor must use suite-<lowercase-sha256>-v<dotted-version>.json' >&2
            exit 1
          fi
          mkdir -p staged
          gh release download suite-payloads --pattern "$DESCRIPTOR" --dir staged
          gh release view suite-payloads --json assets > staged/assets.json

      - name: Verify staged GitHub payload
        env:
          DESCRIPTOR: ${{ inputs.descriptor }}
        run: |
          python .github/scripts/validate_suite_descriptor.py \
            --descriptor "staged/$DESCRIPTOR" \
            --assets staged/assets.json \
            --repository "$GITHUB_REPOSITORY" \
            --output artifact/suite.json

      - name: Publish suite feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -eu
          tag="suite-$CHANNEL"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir -p previous
            gh release download "$tag" --pattern suite.json --dir previous --clobber
            current_version=$(jq -r .version previous/suite.json)
            proposed_version=$(jq -r .version artifact/suite.json)
            PYTHONPATH=.github/scripts python -c \
              'import sys; from build_suite_feed import is_newer; raise SystemExit(0 if is_newer(sys.argv[1], sys.argv[2]) else 1)' \
              "$proposed_version" "$current_version" || {
                echo "Suite version $proposed_version must be newer than published $current_version" >&2
                exit 1
              }
          else
            gh release create "$tag" \
              --title "Calradia Co-op — $CHANNEL suite feed" \
              --notes "Rolling $CHANNEL suite manifest. Payload parts are immutable GitHub release assets."
          fi
          gh release upload "$tag" artifact/suite.json --clobber
          printf 'Feed: https://github.com/%s/releases/download/%s/suite.json\n' \
            "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
